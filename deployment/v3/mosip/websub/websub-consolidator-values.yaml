autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: mosipid/consolidator-websub-service
  tag: 1.2.0.1
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms1000M -Xmx1000M"

resources:
  requests:
    cpu: 200m
    memory: 1536Mi
  limits:
    cpu: 200m
    memory: 1536Mi

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
