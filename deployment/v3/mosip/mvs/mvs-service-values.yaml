autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/manual-verification-service
  tag: "prod_27112025"
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms1250M -Xmx1250M"

resources:
  limits:
    cpu: "300m"
    memory: "2000Mi"
  requests:
    cpu: "300m"
    memory: "1Gi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
