autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/manual-verification-system-ui
  tag: "prod_26102025"
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms750M -Xmx750M"

resources:
  limits:
    cpu: "300m"
    memory: "1500Mi"
  requests:
    cpu: "300m"
    memory: "750Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
