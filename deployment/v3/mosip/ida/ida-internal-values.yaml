autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 3
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/authentication-internal-service
  tag: prod_25092025
  pullPolicy: IfNotPresent
  pullSecrets:
  - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  ## Specify any JAVA_OPTS string here. These typically will be specified in conjunction with above resources
  ## Example: java_opts: "-Xms500M -Xmx500M"
  javaOpts: "-Xms2000M -Xmx2000M"

resources:
  limits:
    cpu: "2"
    memory: "3Gi"
  requests:
    cpu: "2"
    memory: "3Gi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-ida-share
#  - softhsm-ida-share
