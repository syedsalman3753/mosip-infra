autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 15
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/authentication-service
  tag: 1.2.0.1-prod
  pullPolicy: IfNotPresent
  pullSecrets:
  - dockerhub

nodeSelector:
  vlan: "101"

additionalResources:
  ## Specify any JAVA_OPTS string here. These typically will be specified in conjunction with above resources
  ## Example: java_opts: "-Xms500M -Xmx500M"
  javaOpts: "-Xms3000M -Xmx3000M"

resources:
  limits:
    cpu: 4500m
    memory: "4Gi"
  requests:
    cpu: 4500m
    memory: "4Gi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-ida-share
#  - softhsm-ida-share
