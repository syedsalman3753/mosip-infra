autoscaling:
  enabled: false
  minReplicas: 0
  maxReplicas: 0
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/id-repository-identity-service
  tag: prod-25092025_batch
  pullPolicy: IfNotPresent
  pullSecrets:
  - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  ## Specify any JAVA_OPTS string here. These typically will be specified in conjunction with above resources
  ## Example: java_opts: "-Xms500M -Xmx500M"
  javaOpts: "-Xms3000M -Xmx3000M"

resources:
  limits:
    cpu: 500m
    memory: "4Gi"
  requests:
    cpu: 500m
    memory: "4Gi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
