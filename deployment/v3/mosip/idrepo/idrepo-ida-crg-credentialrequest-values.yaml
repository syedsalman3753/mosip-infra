autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 3
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/credential-request-generator
  tag: prod_05102025_auth
  pullPolicy: IfNotPresent
  pullSecrets:
  - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  ## Specify any JAVA_OPTS string here. These typically will be specified in conjunction with above resources
  ## Example: java_opts: "-Xms500M -Xmx500M"
  javaOpts: "-Xms2750M -Xmx2750M"

resources:
  limits:
    cpu: "1"
    memory: "4Gi"
  requests:
    cpu: "1"
    memory: "4Gi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
