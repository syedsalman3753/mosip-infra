autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/id-repository-vid-service
  tag: 1.2.0.1-prod
  pullPolicy: IfNotPresent
  pullSecrets:
  - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  ## Specify any JAVA_OPTS string here. These typically will be specified in conjunction with above resources
  ## Example: java_opts: "-Xms500M -Xmx500M"
  javaOpts: "-Xms1000M -Xmx1000M"

resources:
  limits:
    cpu: 500m
    memory: "3Gi"
  requests:
    cpu: 200m
    memory: "2Gi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
