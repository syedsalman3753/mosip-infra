autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/payment-gateway-service
  tag: "1.2.0.1-prod"
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms3000M -Xmx3000M"

resources:
  limits:
    cpu: "500m"
    memory: "4000Mi"
  requests:
    cpu: "100m"
    memory: "1000Mi"

livenessProbe:
  initialDelaySeconds: 120

readinessProbe:
  initialDelaySeconds: 30

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
