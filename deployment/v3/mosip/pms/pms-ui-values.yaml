autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: mosipid/pmp-ui
  tag: "1.2.0.2"
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "101"

additionalResources:
  javaOpts: "-Xms750M -Xmx750M"

resources:
  limits:
    cpu: "300m"
    memory: "1500Mi"
  requests:
    cpu: "300m"
    memory: "1500Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
