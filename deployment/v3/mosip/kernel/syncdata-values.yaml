autoscaling:
  enabled: true
  minReplicas: 10
  maxReplicas: 10
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/kernel-syncdata-service
  tag: "1.2.0.1-prod"
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms4000M -Xmx4000M"

resources:
  limits:
    cpu: "700m"
    memory: "5500Mi"
  requests:
    cpu: "700m"
    memory: "5500Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
