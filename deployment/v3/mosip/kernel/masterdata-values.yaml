autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 10
  targetCPUUtilizationPercentage: "90"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/kernel-masterdata-service
  tag: "1.2.0.1-prod-schema"
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms1250M -Xmx1250M"

resources:
  limits:
    cpu: "500m"
    memory: "3584Mi"
  requests:
    cpu: "500m"
    memory: "3584Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
