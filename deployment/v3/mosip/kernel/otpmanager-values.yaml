autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/kernel-otpmanager-service
  tag: "1.2.0.1-prod"
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms1000M -Xmx1000M"

resources:
  limits:
    cpu: "500m"
    memory: "1536Mi"
  requests:
    cpu: "500m"
    memory: "1536Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
