autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 12
  targetCPUUtilizationPercentage: "90"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/pre-registration-datasync-service
  tag: prod_19072025
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms1500M -Xmx1500M"

resources:
  limits:
    cpu: 500m
    memory: "2500Mi"
  requests:
    cpu: 500m
    memory: "2500Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
