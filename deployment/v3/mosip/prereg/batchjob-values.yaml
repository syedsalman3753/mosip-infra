autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: "90"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/pre-registration-batchjob
  tag: 1.2.0.1-prod
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms1000M -Xmx1000M"

resources:
  limits:
    cpu: 500m
    memory: "2000Mi"
  requests:
    cpu: 500m
    memory: "2000Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
