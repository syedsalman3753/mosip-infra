autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 6
  targetCPUUtilizationPercentage: "90"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/pre-registration-booking-service
  tag: 1.2.0.1-prod
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "100"

additionalResources:
  javaOpts: "-Xms1500M -Xmx1500M"

resources:
  limits:
    cpu: 500m
    memory: "2500Mi"
  requests:
    cpu: 500m
    memory: "2500Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
