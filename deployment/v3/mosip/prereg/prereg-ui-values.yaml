autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 30
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/pre-registration-ui
  tag: prod-30092025
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "100"

additionalResources:
  javaOpts: "-Xms750M -Xmx750M"

resources:
  limits:
    cpu: 300m
    memory: "1500Mi"
  requests:
    cpu: 300m
    memory: "1500Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
