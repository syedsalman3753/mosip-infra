autoscaling:
  enabled: true
  minReplicas: 8
  maxReplicas: 15
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/registration-processor-common-camel-bridge
  tag: prod_14092025
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms1250M -Xmx1250M"

resources:
  limits:
    cpu: 2750m
    memory: "2750Mi"
  requests:
    cpu: 2750m
    memory: "2750Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
