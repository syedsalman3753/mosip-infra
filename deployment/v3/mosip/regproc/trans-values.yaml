autoscaling:
  enabled: true
  minReplicas: 7
  maxReplicas: 7
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/registration-processor-registration-transaction-service
  tag: 08112025
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms1750M -Xmx1750M"

resources:
  limits:
    cpu: 1
    memory: "3000Mi"
  requests:
    cpu: 1
    memory: "3000Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
