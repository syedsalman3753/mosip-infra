autoscaling:
  enabled: true
  minReplicas: 8
  maxReplicas: 8
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/registration-processor-stage-group-3
  tag: prod_03112025
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms3000M -Xmx30000M"

resources:
  limits:
    cpu: 1
    memory: "4500Mi"
  requests:
    cpu: 1
    memory: "4500Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
