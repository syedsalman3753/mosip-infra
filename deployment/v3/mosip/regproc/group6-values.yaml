autoscaling:
  enabled: true
  minReplicas: 9
  maxReplicas: 9
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/registration-processor-stage-group-6
  tag: prod_26102025
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms1750M -Xmx1750M"

resources:
  limits:
    cpu: 1500m
    memory: "3000Mi"
  requests:
    cpu: 1500m
    memory: "3000Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
