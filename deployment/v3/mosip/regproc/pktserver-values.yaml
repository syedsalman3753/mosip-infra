autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 5
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/registration-processor-dmz-packet-server
  tag: prod_14092025
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms750M -Xmx750M"

resources:
  limits:
    cpu: 500m
    memory: "1250Mi"
  requests:
    cpu: 500m
    memory: "1250Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
