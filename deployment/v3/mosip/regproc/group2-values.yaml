autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 5
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/registration-processor-stage-group-2
  tag: prod_27112025
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms2500M -Xmx2500M"

resources:
  limits:
    cpu: 1500m
    memory: "4Gi"
  requests:
    cpu: 1500m
    memory: "4Gi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
