autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 8
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/registration-processor-stage-group-8
  tag: prod_12112025
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms3000M -Xmx3000M"

resources:
  limits:
    cpu: 500m
    memory: "4Gi"
  requests:
    cpu: 500m
    memory: "4Gi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
