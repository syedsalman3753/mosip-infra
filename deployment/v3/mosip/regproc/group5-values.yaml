autoscaling:
  enabled: true
  minReplicas: 10
  maxReplicas: 10
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/registration-processor-stage-group-5
  tag: prod_12112025
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms3000M -Xmx3000M"

resources:
  limits:
    cpu: 2
    memory: "4500Mi"
  requests:
    cpu: 2
    memory: "4500Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
