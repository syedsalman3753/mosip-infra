autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/registration-processor-notification-service
  tag: prod_06112025
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms1000M -Xmx1000M"

resources:
  limits:
    cpu: 1
    memory: "1536Mi"
  requests:
    cpu: 1
    memory: "1536Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
