autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 3
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: mosipid/registration-processor-landing-zone
  tag: 1.2.0.1
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms3000M -Xmx3000M"

resources:
  limits:
    cpu: 500m
    memory: "4Gi"
  requests:
    cpu: 500m
    memory: "4Gi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
