autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: "75"
  targetMemoryUtilizationPercentage: "75"

image:
  registry: docker.io
  repository: niradocker/print
  tag: prod_14112025
  pullPolicy: IfNotPresent
  pullSecrets:
    - dockerhub

nodeSelector:
  vlan: "200"

additionalResources:
  javaOpts: "-Xms2250M -Xmx2250M"

resources:
  limits:
    cpu: 1200m
    memory: "9000Mi"
  requests:
    cpu: 400m
    memory: "384Mi"

extraEnvVarsCM:
  - global
  - config-server-share
  - artifactory-share
